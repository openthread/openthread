name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/openthread' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y shellcheck iwyu
        sudo bash script/install-llvm.sh
        python3 -m pip install yapf==0.43.0
        sudo snap install shfmt
        npm install prettier@2.0.4
    - name: Check
      run: |
        script/make-pretty check
        script/check-iwyu-public-header

  markdown-lint-check:
    runs-on: ubuntu-22.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24
        package-manager-cache: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      run: |
        npm install -g @umbrelladocs/linkspector@0.5.5
        wget --timeout=30 --tries=4 -O /tmp/reviewdog.tar.gz https://github.com/reviewdog/reviewdog/releases/download/v0.21.0/reviewdog_0.21.0_Linux_x86_64.tar.gz
        sudo tar -xzf /tmp/reviewdog.tar.gz -C /usr/local/bin reviewdog
        rm -f /tmp/reviewdog.tar.gz

    - name: Run linkspector
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +o pipefail
        linkspector check -c .linkspector.yml -j |
          reviewdog -f=rdjson \
            -name=Linkspector \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=any \
            -level=error

  cmake-presets:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
    - name: Build
      run: |
        cmake --preset simulation
        cmake --build --preset simulation
        ctest --preset simulation

  cmake-presets-platform-options:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
    - name: Build and test with platform-specific options enabled
      run: |
        cmake --preset simulation -DOT_CRYPTO_CCM_ONE_SHOT=ON -DOT_MAC_ALLOW_INCOMPLETE_RX_ENH_ACK=ON
        cmake --build --preset simulation
        ctest --preset simulation

  cmake-version:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
        sudo apt-get remove -y cmake || true
        sudo apt-get purge -y --auto-remove cmake || true
        rm -rf cmake-3.10.3*
        wget --timeout=30 --tries=4 http://www.cmake.org/files/v3.10/cmake-3.10.3.tar.gz
        tar xf cmake-3.10.3.tar.gz
        cd cmake-3.10.3
        ./configure
        sudo make install
        cmake --version | grep 3.10.3
    - name: Build
      run: |
        OT_NODE_TYPE=rcp ./script/test build

  package:
    name: package-${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            compiler_c: gcc
            compiler_cpp: g++
          - compiler: clang
            compiler_c: clang
            compiler_cpp: clang++
    env:
      CC: ${{ matrix.compiler_c }}
      CXX: ${{ matrix.compiler_cpp }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build libreadline-dev libncurses-dev
    - name: Package
      run: |
        script/test package

  scan-build:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y clang-tools-14 ninja-build
    - name: Run
      run: |
        script/check-scan-build

  mbedtls2-build:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build libreadline-dev libncurses-dev
        cd third_party/mbedtls/repo && git fetch --tags && git checkout tags/v2.28.8
    - name: Build
      run: |
        OT_OPTIONS='-DCMAKE_POLICY_VERSION_MINIMUM=3.5' ./script/test build

  arm-gcc:
    name: arm-gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc_ver: 5
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/5_4-2016q3/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-5_4-2016q3
          - gcc_ver: 6
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/6-2017q2/gcc-arm-none-eabi-6-2017-q2-update-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-6-2017-q2-update
          - gcc_ver: 7
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/7-2018q2/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-7-2018-q2-update
          - gcc_ver: 9
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2019q4/RC2.1/gcc-arm-none-eabi-9-2019-q4-major-x86_64-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-9-2019-q4-major
          - gcc_ver: 10
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-10.3-2021.10
          - gcc_ver: 11
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi.tar.xz
            gcc_extract_dir: arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi
          - gcc_ver: 12
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz
            gcc_extract_dir: arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi
          - gcc_ver: 13
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
            gcc_extract_dir: arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi
          - gcc_ver: 14
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
            gcc_extract_dir: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
          - gcc_ver: 15
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
            gcc_extract_dir: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      env:
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential lib32z1 ninja-build gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        rm -rf /tmp/gcc-arm /tmp/${{ matrix.gcc_extract_dir }}
        wget --timeout=30 --tries 4 --no-verbose ${{ matrix.gcc_download_url }} -O /tmp/gcc-arm
        tar xf /tmp/gcc-arm -C /tmp
        script/check-arm-build setup
    - name: Build
      env:
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        export PATH=/tmp/${{ matrix.gcc_extract_dir }}/bin:$PATH
        script/check-arm-build

  gcc:
    name: gcc-${{ matrix.gcc_ver }}-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc_ver: [9, 10, 11, 12]
        target: [simulation-1.1, simulation-1.4, posix, posix-daemon]
    env:
      CC: gcc-${{ matrix.gcc_ver }}
      CXX: g++-${{ matrix.gcc_ver }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        case ${{ matrix.gcc_ver }} in
          11)
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            ;;
        esac
        sudo apt-get --no-install-recommends install -y gcc-${{ matrix.gcc_ver }} g++-${{ matrix.gcc_ver }} ninja-build libreadline-dev libncurses-dev unifdef
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix | posix-daemon)
            script/check-posix-build "${{ matrix.target }}"
            ;;
        esac

  clang:
    name: clang-${{ matrix.clang_ver }}-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang_ver: ["17", "18", "19"]
        target: [simulation-1.1, simulation-1.4, posix, posix-daemon]
    env:
      CC: clang-${{ matrix.clang_ver }}
      CXX: clang++-${{ matrix.clang_ver }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Bootstrap
        timeout-minutes: 10
        shell: bash ./script/retry {0}
        run: |
          rm -f llvm.sh
          wget --timeout=30 --tries=4 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.clang_ver }}
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y ninja-build libreadline-dev libncurses-dev unifdef
      - name: Build
        run: |
          case ${{ matrix.target }} in
            simulation-1.1)
              script/check-simulation-build 1.1
              ;;
            simulation-1.4)
              script/check-simulation-build 1.4
              ;;
            posix | posix-daemon)
              script/check-posix-build "${{ matrix.target }}"
              ;;
          esac

  gn:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build gn
    - name: Build
      run: |
        script/check-gn-build

  macos:
    name: macos-${{ matrix.CC }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        CC: [clang, gcc]
        target: [posix, simulation-1.1, simulation-1.4]
        include:
          - CC: clang
            CXX: clang++
          - CC: gcc
            CXX: g++
    runs-on: macos-14
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix)
            script/check-posix-build
            ;;
        esac

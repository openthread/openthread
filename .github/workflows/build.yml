name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/openthread' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 25
      shell: bash ./script/retry {0}
      run: |
        ./script/install-pretty-tools.sh --iwyu
    - name: Check
      run: |
        script/make-pretty check
        script/check-iwyu-public-header

  markdown-lint-check:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24
        package-manager-cache: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: ./script/check-markdown-links bootstrap

    - name: Run linkspector
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./script/check-markdown-links run

  cmake-presets:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
    - name: Build
      run: |
        cmake --preset simulation
        cmake --build --preset simulation
        ctest --preset simulation

  cmake-presets-platform-options:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
    - name: Build and test with platform-specific options enabled
      run: |
        cmake --preset simulation -DOT_CRYPTO_CCM_ONE_SHOT=ON -DOT_MAC_ALLOW_INCOMPLETE_RX_ENH_ACK=ON
        cmake --build --preset simulation
        ctest --preset simulation

  cmake-version:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential ninja-build libreadline-dev libncurses-dev
        sudo apt-get purge -y cmake cmake-data || true
        sudo rm -rf /usr/local/bin/cmake /usr/local/bin/ctest /usr/local/bin/cpack /usr/local/bin/ccmake /usr/local/bin/cmake-gui /usr/local/share/cmake-* /usr/local/doc/cmake*
        wget --timeout=30 --tries=4 -O /tmp/cmake-3.10.3-Linux-x86_64.tar.gz https://cmake.org/files/v3.10/cmake-3.10.3-Linux-x86_64.tar.gz
        echo "9e7c48b797484f74c5ee3ae55132b40b16ed8e81ee762402da8971205b0a896b  /tmp/cmake-3.10.3-Linux-x86_64.tar.gz" | sha256sum -c -
        sudo tar -xzf /tmp/cmake-3.10.3-Linux-x86_64.tar.gz --strip-components=1 --no-same-owner --keep-directory-symlink -C /usr/local
        rm -f /tmp/cmake-3.10.3-Linux-x86_64.tar.gz
        hash -r
        which cmake
        cmake --version | grep 3.10.3
    - name: Build
      run: |
        OT_NODE_TYPE=rcp ./script/test build

  package:
    name: package-${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            compiler_c: gcc
            compiler_cpp: g++
          - compiler: clang
            compiler_c: clang
            compiler_cpp: clang++
    env:
      CC: ${{ matrix.compiler_c }}
      CXX: ${{ matrix.compiler_cpp }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build libreadline-dev libncurses-dev
    - name: Package
      run: |
        script/test package

  scan-build:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y clang-tools-14 ninja-build
    - name: Run
      run: |
        script/check-scan-build

  mbedtls2-build:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build libreadline-dev libncurses-dev
        cd third_party/mbedtls/repo && git fetch --tags && git checkout tags/v2.28.8
    - name: Build
      run: |
        OT_OPTIONS='-DCMAKE_POLICY_VERSION_MINIMUM=3.5' ./script/test build

  arm-gcc:
    name: arm-gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc_ver: [5, 6, 7, 9, 10, 11, 12, 13, 14, 15]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      env:
        GCC_VER: ${{ matrix.gcc_ver }}
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential bzip2 ca-certificates curl lib32z1 ninja-build xz-utils gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        script/install-arm-toolchain.sh "${GCC_VER}" "/tmp/arm-gcc-${GCC_VER}"
        script/check-arm-build setup
    - name: Build
      env:
        GCC_VER: ${{ matrix.gcc_ver }}
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        export PATH="/tmp/arm-gcc-${GCC_VER}/bin:${PATH}"
        script/check-arm-build

  gcc:
    name: gcc-${{ matrix.gcc_ver }}-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc_ver: [9, 10, 11, 12]
        target: [simulation-1.1, simulation-1.4, posix, posix-daemon]
    env:
      CC: gcc-${{ matrix.gcc_ver }}
      CXX: g++-${{ matrix.gcc_ver }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y gcc-${{ matrix.gcc_ver }} g++-${{ matrix.gcc_ver }} ninja-build libreadline-dev libncurses-dev
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix | posix-daemon)
            script/check-posix-build "${{ matrix.target }}"
            ;;
        esac

  clang:
    name: clang-${{ matrix.clang_ver }}-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang_ver: ["17", "18", "19"]
        target: [simulation-1.1, simulation-1.4, posix, posix-daemon]
    env:
      CC: clang-${{ matrix.clang_ver }}
      CXX: clang++-${{ matrix.clang_ver }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Bootstrap
        timeout-minutes: 10
        shell: bash ./script/retry {0}
        env:
          CLANG_VER: ${{ matrix.clang_ver }}
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y "clang-${CLANG_VER}" "libclang-rt-${CLANG_VER}-dev" ninja-build libreadline-dev libncurses-dev
      - name: Build
        run: |
          case ${{ matrix.target }} in
            simulation-1.1)
              script/check-simulation-build 1.1
              ;;
            simulation-1.4)
              script/check-simulation-build 1.4
              ;;
            posix | posix-daemon)
              script/check-posix-build "${{ matrix.target }}"
              ;;
          esac

  gn:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build gn
    - name: Build
      run: |
        script/check-gn-build

  macos:
    name: macos-${{ matrix.CC }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        CC: [clang, gcc]
        target: [posix, simulation-1.1, simulation-1.4]
        include:
          - CC: clang
            CXX: clang++
          - CC: gcc
            CXX: g++
    runs-on: macos-15
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix)
            script/check-posix-build
            ;;
        esac

name: Nexus

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/openthread' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  nexus-cert-tests:
    name: nexus-cert-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Cache Wireshark PPA packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/wireshark-ppa-debs
        key: wireshark-ppa-debs-ubuntu-24.04-v1

    - name: Bootstrap
      timeout-minutes: 16
      shell: bash ./script/retry {0}
      env:
        OT_RETRY_TIMEOUT: 300
      run: |
        tshark_status="$(dpkg-query -W -f='${db:Status-Status}' tshark 2>/dev/null || true)"
        tshark_version="$(dpkg-query -W -f='${Version}' tshark 2>/dev/null || true)"
        if [[ "${tshark_status}" != "installed" ]] || ! command -v ninja >/dev/null 2>&1 || ! dpkg --compare-versions "${tshark_version}" ge 4.4; then
          installed_from_cache=false
          if compgen -G "/tmp/wireshark-ppa-debs/tshark_*.deb" >/dev/null; then
            sudo rm -f /etc/apt/sources.list.d/wireshark-dev-stable.list
            sudo apt-get update
            if sudo DEBIAN_FRONTEND=noninteractive apt-get --no-install-recommends install -y ninja-build /tmp/wireshark-ppa-debs/*.deb; then
              installed_from_cache=true
            else
              rm -rf /tmp/wireshark-ppa-debs/*
            fi
          fi
          if [[ "${installed_from_cache}" == false ]]; then
            candidate_ver="$(apt-cache policy tshark | awk '/Candidate:/ {print $2}')"
            if [[ -z "${candidate_ver}" || "${candidate_ver}" == "(none)" ]] || ! dpkg --compare-versions "${candidate_ver}" ge 4.4; then
              sudo rm -f /etc/apt/sources.list.d/wireshark-dev-stable.list
              sudo apt-get update
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
                "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xA2E402B85A4B70CD78D8A3D9D875551314ECA0F0" \
                | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/wireshark-dev-stable.gpg
              echo "deb [signed-by=/etc/apt/keyrings/wireshark-dev-stable.gpg] https://ppa.launchpadcontent.net/wireshark-dev/stable/ubuntu $(. /etc/os-release && echo "${VERSION_CODENAME}") main" \
                | sudo tee /etc/apt/sources.list.d/wireshark-dev-stable.list >/dev/null
              sudo apt-get -o Acquire::Retries=5 update --error-on=any \
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/wireshark-dev-stable.list \
                -o Dir::Etc::sourceparts=- \
                -o APT::Get::List-Cleanup=0
            fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o APT::Keep-Downloaded-Packages=true --no-install-recommends install -y ninja-build tshark
            mkdir -p /tmp/wireshark-ppa-debs
            cp -f /var/cache/apt/archives/*ppa*.deb /tmp/wireshark-ppa-debs/
          fi
        fi
        tshark_version="$(dpkg-query -W -f='${Version}' tshark)"
        if ! dpkg --compare-versions "${tshark_version}" ge 4.4; then
          echo "ERROR: expected tshark >= 4.4 from wireshark PPA, got ${tshark_version}" >&2
          exit 1
        fi
        python3 -m pip install --retries 5 --timeout 30 -r tests/scripts/thread-cert/requirements.txt

    - name: Build Nexus
      run: |
        mkdir -p build/nexus
        top_builddir=build/nexus ./tests/nexus/build.sh

    - name: Run Nexus Tests
      run: |
        top_builddir=build/nexus ./tests/nexus/run_nexus_tests.sh

  nexus-core-tests:
    name: nexus-core-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      env:
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build lcov

    - name: Build Nexus
      run: |
        mkdir -p build/nexus
        top_builddir=build/nexus ./tests/nexus/build.sh

    - name: Run Core Tests
      run: |
        cd build/nexus && ctest -L core --output-on-failure

    - name: Run TREL Tests
      run: |
        cd build/nexus && ctest -L trel --output-on-failure

  nexus-long-routes-tests:
    name: nexus-long-routes-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      env:
        PR_BODY: "${{ github.event.pull_request.body }}"
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build lcov

    - name: Build Nexus
      run: |
        mkdir -p build/nexus
        top_builddir=build/nexus ./tests/nexus/build.sh long_routes

    - name: Run LONG_ROUTES Tests
      run: |
        cd build/nexus && ctest -L long_routes --output-on-failure

  nexus-grpc-tests:
    name: nexus-grpc-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc

    - name: Build Nexus
      run: |
        mkdir -p build/nexus
        OT_NEXUS_GRPC=ON top_builddir=build/nexus ./tests/nexus/build.sh

    - name: Run GRPC Tests
      run: |
        cd build/nexus && ./tests/nexus/nexus_grpc

  nexus-wasm-tests:
    name: nexus-wasm-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y ninja-build

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16

    - name: Build Nexus WASM
      run: |
        mkdir -p build/nexus
        top_builddir=build/nexus ./tests/nexus/build.sh wasm

    - name: Run WASM Smoke Test
      run: |
        node tests/nexus/test_wasm_bindings.mjs build/nexus/tests/nexus/nexus_live_demo.js

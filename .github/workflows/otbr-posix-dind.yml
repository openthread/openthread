name: OTBR DinD

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/openthread' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  dind-dns-sd:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mdns: ["", "--mdnsresponder"]
    env:
      PR_BODY: "${{ github.event.pull_request.body }}"
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Bootstrap
      timeout-minutes: 15
      shell: bash ./script/retry {0}
      run: |
        OPENTHREAD_DIR=$(pwd)
        docker rm -f otbr-dind >/dev/null 2>&1 || true
        sudo rm -rf /tmp/ot-br-posix
        ./script/git-tool clone https://github.com/openthread/ot-br-posix.git --depth 1 --recurse-submodules --shallow-submodules /tmp/ot-br-posix
        cd /tmp/ot-br-posix
        rm -rf third_party/openthread/repo
        mkdir -p third_party/openthread/repo
        rsync -r --exclude=.git --exclude=build --exclude=ot_testing "${OPENTHREAD_DIR}/." third_party/openthread/repo
        docker build -t otbr-dind-runner -f etc/docker/test/Dockerfile.dind_runner .
        docker rm -f otbr-dind >/dev/null 2>&1 || true
        docker run -d --privileged --name otbr-dind \
          -v /tmp/ot-br-posix:/usr/src/ot-br-posix \
          -w /usr/src/ot-br-posix \
          -e DOCKER_HOST=unix:///var/run/docker.sock \
          otbr-dind-runner \
          sh -c "dockerd --host=unix:///var/run/docker.sock >/dev/null 2>&1"
        if grep -q -- '--setup-only' tests/scripts/test_dind_dns_sd.sh; then
          docker exec otbr-dind ./tests/scripts/test_dind_dns_sd.sh --setup-only ${{ matrix.mdns }}
        fi

    - name: Run DinD Integration Test
      run: |
        if grep -q -- '--run-only' /tmp/ot-br-posix/tests/scripts/test_dind_dns_sd.sh; then
          docker exec otbr-dind ./tests/scripts/test_dind_dns_sd.sh --run-only ${{ matrix.mdns }}
        else
          docker exec otbr-dind ./tests/scripts/test_dind_dns_sd.sh ${{ matrix.mdns }}
        fi
